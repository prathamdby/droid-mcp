name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fmt:check

      # The extracted dialect codecs must match the pinned SDK declarations.
      - run: pnpm codegen:check

      # Every module under src/ must obey the acyclic dependency and boundary rules.
      - run: pnpm check:boundaries

      # The vendored anti-slop plugin's own rule tests (RuleTester + CLI autofix).
      - run: pnpm test:lint-rules

      # All unit and architectural proof suites.
      - run: pnpm test
